# Application Name
spring.application.name=gold-stock-system

# Server Port
server.port=8080

# ===============================
# DATABASE CONFIGURATION (H2)
# ===============================
# Use H2 by default for easy setup and testing
spring.datasource.url=jdbc:h2:mem:goldshopdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# Uncomment the following lines to use MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/goldshop_db?useSSL=false&serverTimezone=UTC
