<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Rate - Tumbe Jewellary Works</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 style="color: var(--primary-color);">Tumbe Jewellary Works</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="articles.html">Articles</a>
            <a href="gold-rate.html" class="active">Gold Rate</a>
            <a href="selling-price.html">Selling Prices</a>
        </nav>
        <main>
            <section class="status-section">
                <h2>Today's Rate</h2>
                <div id="todayRateDisplay" class="rate-display">Loading...</div>
                <button onclick="fetchLatestRate()" class="btn">Force Fetch from API</button>
            </section>

            <section class="form-section">
                <h2>Manual Update</h2>
                <form id="updateRateForm">
                    <div class="form-group">
                        <label for="manualRate">New Rate (per gram)</label>
                        <input type="number" step="0.01" id="manualRate" required>
                    </div>
                    <button type="submit" class="btn">Update Rate</button>
                </form>
            </section>

            <section class="list-section">
                <h2>Rate History</h2>
                <table id="rateHistoryTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Rate (per gram)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTodayRate();
            loadRateHistory();
        });
        document.getElementById('updateRateForm').addEventListener('submit', updateRateManual);
    </script>
</body>

</html>
