<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Gold Stock Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Manage Articles</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="articles.html" class="active">Articles</a>
            <a href="gold-rate.html">Gold Rate</a>
            <a href="selling-price.html">Selling Prices</a>
        </nav>
        <main>
            <section class="form-section">
                <h2>Add New Article</h2>
                <form id="addArticleForm">
                    <div class="form-group">
                        <label for="articleId">Article ID</label>
                        <input type="text" id="articleId" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description">
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (grams)</label>
                        <input type="number" step="0.01" id="weight" required>
                    </div>
                    <div class="form-group">
                        <label for="makingCharges">Making Charges</label>
                        <input type="number" step="0.01" id="makingCharges" required>
                    </div>
                    <div class="form-group">
                        <label for="wastage">Wastage (%)</label>
                        <input type="number" step="0.01" id="wastage" required>
                    </div>
                    <button type="submit" class="btn">Add Article</button>
                </form>
            </section>

            <section class="list-section">
                <h2>Article List</h2>
                <div class="form-group" style="max-width: 400px; margin-bottom: 20px;">
                    <label for="searchArticle">Search Articles</label>
                    <input type="text" id="searchArticle" placeholder="Search by ID, Name, or Description..."
                        oninput="filterArticles()">
                </div>
                <table id="articlesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Weight (g)</th>
                            <th>Making Charges</th>
                            <th>Wastage (%)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadArticles);
        document.getElementById('addArticleForm').addEventListener('submit', addArticle);
    </script>
</body>

</html>
