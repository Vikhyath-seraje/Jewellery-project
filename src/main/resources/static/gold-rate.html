<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Rates - Tumbe Jewellary Works</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Tumbe Jewellary Works</h1>
        </header>
        <nav>
            <a href="index.html">Home</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="gold-rate.html" class="active">Gold Rate</a>
            <a href="schemes.html">Gold Schemes</a>
            <button onclick="window.location.href='catalogue.html'; setTimeout(() => toggleAdminMode(), 100);"
                class="btn" style="padding: 5px 10px; margin-left: auto; background-color: #333;">Admin</button>
        </nav>
        <main>
            <h2>Daily Metal Rates</h2>

            <div class="rate-display-container">
                <div class="rate-box">
                    <h3>Gold 24K</h3>
                    <div id="rate-GOLD-24K" class="price">Loading...</div>
                </div>
                <div class="rate-box">
                    <h3>Gold 22K</h3>
                    <div id="rate-GOLD-22K" class="price">Loading...</div>
                </div>
                <div class="rate-box">
                    <h3>Silver (Fine)</h3>
                    <div id="rate-SILVER-FINE" class="price">Loading...</div>
                </div>
            </div>

            <div style="text-align: center; margin-bottom: 30px;">
                <button onclick="fetchLatestRate()" class="btn">Fetch Latest Rates from API</button>
            </div>

            <div class="card" style="text-align: left; margin-bottom: 30px;">
                <h3>Manual Rate Update</h3>
                <form onsubmit="updateRateManual(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: end;">
                        <div class="form-group">
                            <label for="manualMetalType">Metal Type</label>
                            <select id="manualMetalType">
                                <option value="GOLD">Gold</option>
                                <option value="SILVER">Silver</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="manualPurity">Purity</label>
                            <select id="manualPurity">
                                <option value="24K">24K</option>
                                <option value="22K" selected>22K</option>
                                <option value="FINE">Fine</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="manualRate">Rate (₹/gram)</label>
                            <input type="number" id="manualRate" step="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Update Rate</button>
                </form>
            </div>

            <h3>Rate History</h3>
            <table id="rateHistoryTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Metal</th>
                        <th>Purity</th>
                        <th>Rate (₹/gram)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- History will be loaded here -->
                </tbody>
            </table>
        </main>
    </div>
    <script src="js/app.js?v=1.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAllRates();
            loadRateHistory();
        });
    </script>
</body>

</html>
